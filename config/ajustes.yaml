version: "0.1.0"
correoCebb: eticafi@udec.cl
conservacionMeses: 12
conservacionRespaldoMeses: 60
# Plazo máximo con justificación sin revisión del CEBB (P-DAT-06 = extendido). Provisional: lo definen el CEBB y UdeC (REQ-76).
