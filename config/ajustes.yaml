contactoIncidentes: "por definir por UdeC (provisional): el delegado de protección de datos u otra instancia UdeC que se designe; mientras tanto, notificar de inmediato al CEBB (eticafi@udec.cl)"
almacenamientoInstitucional: "cuentas institucionales UdeC (por definir por UdeC, provisional): almacenamiento en la nube institucional o servidores del departamento, con acceso restringido al profesor guía y al estudiante"
urlModeloCI: "por definir por UdeC (provisional): enlace al modelo de consentimiento informado del CEBB-VRID"
