    generalCambios: >-
      Informaremos al CEBB-FI cualquier cambio relevante del proyecto. Si un cambio hace que el proyecto deje de cumplir las condiciones de este compromiso, solicitaremos la revisión del CEBB-FI antes de continuar.
    inicio_registro: >-
      Enviado este registro al CEBB-FI, el trabajo con personas o datos puede comenzar; no se requiere acuse
      de recibo. El CEBB-FI podrá solicitar información adicional o revisar el proyecto con posterioridad.
    inicio_solicitud_abreviada: >-
