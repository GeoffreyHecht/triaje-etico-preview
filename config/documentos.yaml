    respuestasTitulo: Respuestas dadas
    alertasTitulo: Alertas
    recomendacion: Se recomienda conservar este documento como respaldo.
    nota: >-
      El CEBB-FI puede solicitar esta constancia en cualquier momento y puede revisar el proyecto si cambian
      sus condiciones. Si el proyecto cambia (p. ej., se incorporan personas, datos personales o laboratorio),
      debe repetirse la autoevaluación.

